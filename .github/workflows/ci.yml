name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # engines 声明 >=20.13.0；20 是最低门槛，22/24 是当前主力与最新 LTS。
        node: ['20', '22', '24']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 这个包没有 dependencies / devDependencies，测试只 import node 内置模块，
      # 所以不需要 install —— 少一步就少一处可能失败的环节。
      - name: 环境自检
        run: |
          node --version
          npm --version

      - name: 单元与集成测试
        run: npm test

      # gateway 在没给 WIKI_ROOT / WIKI_TOOLS 时只跑参数校验与故障隔离那 11 条，
      # 正好用来守「没有 Python 管线时也不能假装成功」这条。
      - name: 知识网关降级路径
        run: node tests/gateway.mjs

      - name: 打包内容自检
        run: npm pack --dry-run
