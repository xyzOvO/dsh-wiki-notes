<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="知识库面板：左侧栏一本书的图标点进去，是检索 / 概览 / 调用记录三页签；检索结果直接给出命中小节的正文和出处。">
  <defs>
    <style>
      .bg { fill: #fffdf8; }
      .rail { fill: #f4efe4; }
      .card { fill: #fffefb; stroke: #e3daca; }
      .line { stroke: #ece5d8; }
      .t { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .h { fill: #1f1c18; font-weight: 650; }
      .m { fill: #6f6558; }
      .f { fill: #8a7f6e; }
      .brand { fill: #4b6ef5; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .chip { fill: #f4efe4; stroke: #e3daca; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="560" rx="14"/>
  <rect class="rail" x="0" y="0" width="64" height="560" rx="14"/>
  <rect class="rail" x="40" y="0" width="24" height="560"/>

  <!-- 左侧栏：一本书（当前选中） -->
  <rect x="14" y="20" width="36" height="36" rx="10" fill="#e8eefc"/>
  <g fill="none" stroke="#4b6ef5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 29c3.2-1.4 6-1.4 10 0v14c-4-1.4-6.8-1.4-10 0z"/>
    <path d="M42 29c-3.2-1.4-6-1.4-10 0v14c4-1.4 6.8-1.4 10 0z"/>
  </g>
  <!-- 另两个面板（未选中） -->
  <rect x="16" y="74" width="32" height="32" rx="9" fill="#eee7d9"/>
  <path d="M26 90h12" stroke="#8a7f6e" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="16" y="118" width="32" height="32" rx="9" fill="#eee7d9"/>
  <circle cx="32" cy="134" r="6" fill="none" stroke="#8a7f6e" stroke-width="2.2"/>

  <!-- 头部 -->
  <text class="t h" x="88" y="46" font-size="19">知识库</text>
  <text class="t m" x="88" y="70" font-size="12.5">模型查库的每一次调用，和它查到的正文、出处，都在这一页里看得见。</text>

  <!-- 页签 -->
  <rect x="88" y="86" width="62" height="28" rx="8" fill="#1f1c18"/>
  <text class="t" x="119" y="105" font-size="12.5" fill="#fffdf8" text-anchor="middle">检索</text>
  <text class="t m" x="176" y="105" font-size="12.5">概览</text>
  <text class="t m" x="228" y="105" font-size="12.5">调用记录</text>

  <!-- 搜索框 -->
  <rect x="88" y="128" width="640" height="38" rx="9" fill="#fbf7ef" stroke="#e3daca"/>
  <circle cx="107" cy="147" r="5.5" fill="none" stroke="#8a7f6e" stroke-width="2"/>
  <path d="M111 151l4 4" stroke="#8a7f6e" stroke-width="2" stroke-linecap="round"/>
  <text class="t h" x="122" y="152" font-size="13">上下文 预算</text>
  <text class="t f" x="660" y="152" font-size="12" text-anchor="end">Enter 检索</text>

  <text class="t f" x="88" y="192" font-size="11.5">命中 2 页 · 参与 142 页 · 22ms</text>

  <!-- 结果 1 -->
  <rect class="card" x="88" y="204" width="640" height="132" rx="11"/>
  <text class="t h" x="104" y="228" font-size="13.5">上下文预算</text>
  <rect class="chip" x="196" y="214" width="60" height="19" rx="9"/>
  <text class="t m" x="226" y="227" font-size="10.5" text-anchor="middle">概念</text>
  <text class="t f" x="712" y="228" font-size="11.5" text-anchor="end">92 分</text>
  <text class="t m" x="104" y="250" font-size="11.5">摘要：把上下文当预算花，先花在要回答什么上。</text>
  <text class="t f" x="104" y="270" font-size="10.5">§结论</text>
  <text class="t m" x="104" y="290" font-size="11.5">上下文预算的核心是排序，不是压缩 —— 先决定哪几段值得进窗口。</text>
  <text class="t m" x="104" y="310" font-size="11.5">省下来的预算留给推理，而不是省给更长的原文。</text>
  <text class="t f mono" x="104" y="328" font-size="10">← [[上下文预算]] → 概念-concepts/上下文预算.md</text>

  <!-- 结果 2 -->
  <rect class="card" x="88" y="348" width="640" height="104" rx="11"/>
  <text class="t h" x="104" y="372" font-size="13.5">检索召回</text>
  <rect class="chip" x="184" y="358" width="60" height="19" rx="9"/>
  <text class="t m" x="214" y="371" font-size="10.5" text-anchor="middle">概念</text>
  <text class="t f" x="712" y="372" font-size="11.5" text-anchor="end">71 分</text>
  <text class="t f" x="104" y="394" font-size="10.5">§讲了什么</text>
  <text class="t m" x="104" y="414" font-size="11.5">召回靠全量扫描，预算只影响排序权重。</text>
  <text class="t f mono" x="104" y="436" font-size="10">← [[检索召回]] → 概念-concepts/检索召回.md</text>

  <!-- 右栏：概览 -->
  <rect class="card" x="752" y="128" width="176" height="150" rx="11"/>
  <text class="t h" x="768" y="150" font-size="12">这个库</text>
  <text class="t m" x="768" y="172" font-size="11">页面 · 小节</text>
  <text class="t h" x="912" y="172" font-size="12.5" text-anchor="end">142 · 198</text>
  <line class="line" x1="768" y1="184" x2="912" y2="184"/>
  <text class="t m" x="768" y="204" font-size="11">没读到的文件</text>
  <text class="t h" x="912" y="204" font-size="12.5" text-anchor="end">0</text>
  <line class="line" x1="768" y1="216" x2="912" y2="216"/>
  <text class="t m" x="768" y="236" font-size="11">实时同步</text>
  <text class="t m" x="912" y="236" font-size="11.5" text-anchor="end" fill="#2f6b46">开着</text>
  <line class="line" x1="768" y1="248" x2="912" y2="248"/>
  <text class="t m" x="768" y="268" font-size="11">扫描耗时</text>
  <text class="t m" x="912" y="268" font-size="11.5" text-anchor="end">38ms</text>

  <!-- 右栏：不联网 -->
  <rect class="card" x="752" y="290" width="176" height="82" rx="11"/>
  <text class="t h" x="768" y="312" font-size="12">只读 · 不联网</text>
  <text class="t m" x="768" y="332" font-size="10.5">笔记只在你的机器上，</text>
  <text class="t m" x="768" y="348" font-size="10.5">插件不写库、不外发。</text>

  <!-- 底注 -->
  <text class="t f" x="88" y="486" font-size="11">同一个库，模型查一次、你在面板里查一次，都记进同一份调用记录。</text>
  <text class="t f" x="88" y="508" font-size="11">零命中时会给出「最接近的几页」—— 库可能没写，也可能只是说法对不上。</text>
</svg>
